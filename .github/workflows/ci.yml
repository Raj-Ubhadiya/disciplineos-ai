name: CI

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://disciplineos_user:disciplineos_dev_123@localhost:5432/disciplineos?schema=public
      DIRECT_URL: postgresql://disciplineos_user:disciplineos_dev_123@localhost:5432/disciplineos?schema=public
      CORS_ORIGIN: http://localhost:3000
      JWT_SECRET: ci-development-secret-minimum-32-characters
      JWT_EXPIRATION: 3600
      SWAGGER_ENABLED: true
      NEXT_PUBLIC_APP_NAME: DisciplineOS AI
      NEXT_PUBLIC_APP_DESCRIPTION: AI-powered discipline, goals, habits, and accountability partners.
      NEXT_PUBLIC_API_URL: http://localhost:4000/api/v1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable Corepack
        run: corepack enable

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10.0.0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma Client
        run: pnpm --filter @disciplineos/api prisma:generate

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Build
        run: pnpm build
